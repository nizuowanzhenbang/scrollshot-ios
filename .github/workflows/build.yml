name: Build and test iOS
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Build a test IPA in one Mac job, without simulator UI tests'
        type: boolean
        default: false
  push:
    branches: [main, feat/native]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: ${{ !inputs.preview_only }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Core tests
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: test.log
          retention-days: 3
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Core tests for preview
        if: ${{ inputs.preview_only }}
        run: swift test
      - name: Device IPA builds
        shell: bash
        run: bash scripts/build.sh
      - name: Negative package checks
        run: python3 -m unittest discover -s scripts -p test_verify_ipa.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            build/*.ipa
            build/*-verification.json
            build/*-build.log
            build/SHA256SUMS.txt
          retention-days: 3
      - name: Simulator smoke test
        if: ${{ !inputs.preview_only }}
        timeout-minutes: 15
        shell: bash
        run: bash scripts/simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.preview_only }}
        with:
          name: simulator-evidence
          path: |
            build/*-screen.png
            build/simulator-*.json
            build/simulator-build.log
            build/simulator-launch.log
            build/ui-test.log
            build/ui-tests.xcresult
            build/ui-attachments
            build/attachment-export.log
          retention-days: 3
